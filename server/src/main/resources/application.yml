# 公共配置：只放与环境无关的内容，数据库、Redis、密钥一律下沉到 profile
server:
  port: 8123
  servlet:
    context-path: /api/v1

spring:
  application:
    name: yunjian-server
  profiles:
    # 默认按开发环境启动；部署时用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 登录鉴权配置：自定义配置使用独立前缀，不挂在 spring 命名空间下
yunjian:
  jwt:
    # 有效期与环境无关，开发和生产保持一致；密钥在各 profile 中单独配置
    expire-seconds: 7200

mybatis-plus:
  configuration:
    # 开启驼峰命名规则 数据库的 username 对应 Java 的 userName
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config: # 逻辑删除配置 配合实体中 @TableLogic 需要和数据库中的字段对应
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
