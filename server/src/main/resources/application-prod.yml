# 生产环境：所有敏感项一律走环境变量，且不设默认值。
# 变量缺失时 Spring 报 "Could not resolve placeholder" 直接启动失败，避免带着错误的默认值上线。
#
# 必需环境变量：
#   DB_URL          例 jdbc:mysql://mysql:3306/yunjian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#   DB_USERNAME     数据库账号
#   DB_PASSWORD     数据库密码
#   REDIS_HOST      Redis 地址
#   YUNJIAN_JWT_SECRET  JWT 签名密钥，长度不少于 32 字节（可用 openssl rand -base64 48 生成）
#
# 可选环境变量：
#   REDIS_PORT（默认 6379）、REDIS_PASSWORD（默认空）、REDIS_DATABASE（默认 0）

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

yunjian:
  jwt:
    secret: ${YUNJIAN_JWT_SECRET}

logging:
  level:
    root: warn
    com.bond.yunjian: info
  file:
    name: logs/yunjian-server.log
