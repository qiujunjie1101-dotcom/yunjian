# 开发环境：本机 MySQL + Redis，允许打印 SQL，密钥可用固定值
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yunjian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

yunjian:
  jwt:
    # 仅开发使用；长度必须 >= 32 字节，否则 JwtUtil 启动即失败
    secret: ${YUNJIAN_JWT_SECRET:dev-only-yunjian-jwt-secret-key-0001}

mybatis-plus:
  configuration:
    # 控制台打印 SQL，生产环境关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.bond.yunjian: debug
