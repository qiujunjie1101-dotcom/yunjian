name: CI

# 触发时机：推送 main、打版本标签、向 main 提 PR、手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未跑完的任务，省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只读仓库内容
permissions:
  contents: read

jobs:
  build:
    name: 构建与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # action 全部用 commit SHA 锁定（注释里是对应版本），防止 tag 被篡改
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      # 一条命令走完编译 -> 单元测试 -> 打包，任一环节失败立即中断
      # pom.xml 已下沉到 server/，故指定工作目录
      - name: 编译 / 测试 / 打包
        working-directory: server
        run: mvn -B -ntp verify

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yunjian-server-${{ github.sha }}
          path: server/target/*.jar
          retention-days: 7
          if-no-files-found: error
